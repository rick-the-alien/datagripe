name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: datagripe
          POSTGRES_PASSWORD: datagripe
          POSTGRES_DB: datagripe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datagripe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: datagripe
          MYSQL_DATABASE: demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pdatagripe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Run migrations
        env:
          APP_DATABASE_URL: postgres://datagripe:datagripe@localhost:5432/datagripe
          CONNECTION_ENCRYPTION_KEY: ci-encryption-key-0123456789abcdef
          SESSION_SECRET: ci-session-secret-0123456789abcdef
        run: bun run db:migrate

      - name: Build web
        run: bun run --cwd apps/web build

      - name: Embedded mode boot smoke
        env:
          DATABASE_MODE: embedded
          EMBEDDED_PG_DATA_DIR: ${{ runner.temp }}/dg-embedded/pg
          PORT: "39871"
        run: |
          bun run apps/server/src/index.ts &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf http://localhost:39871/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:39871/health
          curl -sf http://localhost:39871/api/session | grep -q '"authDisabled":true'
          curl -sf -o /dev/null -w '%{http_code}' -X POST http://localhost:39871/api/auth/login | grep -q 404
