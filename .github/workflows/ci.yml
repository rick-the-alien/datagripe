name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: datagripe
          POSTGRES_PASSWORD: datagripe
          POSTGRES_DB: datagripe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datagripe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: datagripe
          MYSQL_DATABASE: demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pdatagripe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Run migrations
        env:
          APP_DATABASE_URL: postgres://datagripe:datagripe@localhost:5432/datagripe
          CONNECTION_ENCRYPTION_KEY: ci-encryption-key-0123456789abcdef
          SESSION_SECRET: ci-session-secret-0123456789abcdef
        run: bun run db:migrate

      - name: Build web
        run: bun run --cwd apps/web build
