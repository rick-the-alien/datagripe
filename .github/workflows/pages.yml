name: Site

# Deploys `site/` to GitHub Pages straight from main. No `gh-pages`
# branch: Pages can publish a workflow artifact, so the site's source
# lives beside the code it describes and cannot drift onto a branch
# nobody looks at.
#
# Requires Settings → Pages → Source = "GitHub Actions", once.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should replace a pending one, but never cancel a run
# that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The site is plain HTML, CSS and one script — there is nothing to
      # build, and a build step would only be somewhere for it to break.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
