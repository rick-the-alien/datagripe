services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: datagripe
      POSTGRES_PASSWORD: datagripe
      POSTGRES_DB: datagripe
    ports:
      - "5432:5432"
    volumes:
      - datagripe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datagripe -d datagripe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datagripe-postgres:
